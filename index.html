<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الانضمام إلى TNL Esports</title>
  <style>
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    .hero {
      background: linear-gradient(to bottom, #001f3f, #000);
      padding: 80px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5em;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }
    .cta-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #00f0ff;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    .cta-button:hover {
      background: #0ff;
    }
    .form-section {
      padding: 50px 20px;
      max-width: 600px;
      margin: auto;
    }
    form input, form textarea, form select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      border-radius: 5px;
    }
    form button {
      background: #0ff;
      color: #000;
      padding: 10px 20px;
      border: none;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    form button:hover {
      background: #00e0e0;
    }
    #preview {
      display: none;
      margin-top: 10px;
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>هل أنت مستعد للصعود إلى العالمية؟</h1>
    <a href="#form" class="cta-button">قدّم الآن</a>
  </section>
  <section id="form" class="form-section">
    <h2>استمارة الانضمام إلى TNL Esports</h2>
    <form id="joinForm" enctype="multipart/form-data">
      <input type="text" name="fullName" placeholder="الاسم الكامل" required />
      <input type="text" name="nickname" placeholder="اسم اللاعب داخل اللعبة" required />
      <input type="number" name="age" placeholder="العمر" required />
      <input type="text" name="country" placeholder="الدولة / الجنسية" required />
      <select name="game" required>
        <option value="">اختر لعبتك الأساسية</option>
        <option value="Valorant">Valorant</option>
        <option value="PUBG">PUBG</option>
        <option value="Call of Duty">Call of Duty</option>
        <option value="أخرى">أخرى</option>
      </select>
      <input type="text" name="rank" placeholder="الرتبة / مستوى اللعب" required />
      <input type="url" name="profileLink" placeholder="رابط مقاطع اللعب أو البروفايل" />
      <textarea name="experience" placeholder="هل سبق لك اللعب ضمن فريق؟" rows="3"></textarea>
      <textarea name="reason" placeholder="لماذا تريد الانضمام إلى الفريق؟" rows="3" required></textarea>
      
      <label for="photo" style="display:block; margin-top:15px; font-weight:bold;">أرسل صورتك الحقيقية مع كامل الوجه</label>
      <input type="file" id="photo" name="photo" accept="image/*" required onchange="previewImage()">
      <img id="preview" alt="معاينة الصورة">

      <input type="text" name="contact" placeholder="البريد الإلكتروني أو Telegram / Discord" required />
      <button type="submit">إرسال الطلب</button>
    </form>
    <div id="responseMsg" style="margin-top:15px;"></div>
  </section>

  <script>
    function previewImage() {
      const file = document.getElementById('photo').files[0];
      const preview = document.getElementById('preview');
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
        preview.src = '#';
      }
    }

    document.getElementById("joinForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      let data = {};
      formData.forEach((value, key) => data[key] = value);

      const photoFile = document.getElementById("photo").files[0];
      if (!photoFile || !photoFile.type.startsWith("image/")) {
        document.getElementById("responseMsg").innerText = "يرجى تحميل صورة شخصية صحيحة.";
        return;
      }

      const photoData = new FormData();
      photoData.append("chat_id", "5854920900");
      photoData.append("caption",
        `طلب انضمام جديد:\nالاسم: ${data.fullName}\nالنك نيم: ${data.nickname}\nالعمر: ${data.age}\nالدولة: ${data.country}\nاللعبة: ${data.game}\nالرتبة: ${data.rank}\nالرابط: ${data.profileLink}\nالخبرة: ${data.experience}\nالسبب: ${data.reason}\nالتواصل: ${data.contact}`
      );
      photoData.append("photo", photoFile);

      fetch("https://api.telegram.org/bot7774638878:AAFvBGSVfYmJDIOsXLNtWMEpDvs8tmLeqVg/sendPhoto", {
        method: "POST",
        body: photoData
      }).then(response => {
        document.getElementById("responseMsg").innerText = "تم إرسال الطلب بنجاح. سنقوم بالتواصل معك قريباً.";
        this.reset();
        document.getElementById("preview").style.display = "none";
      }).catch(error => {
        document.getElementById("responseMsg").innerText = "حدث خطأ أثناء الإرسال. حاول مرة أخرى.";
      });
    });
  </script>
</body>
</html>
